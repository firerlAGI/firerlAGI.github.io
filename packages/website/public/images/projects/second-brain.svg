<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="second-brain-title">
  <title id="second-brain-title">Second Brain product interface preview</title>
  <defs>
    <linearGradient id="sb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10251f"/>
      <stop offset="0.48" stop-color="#111a2f"/>
      <stop offset="1" stop-color="#2a1f17"/>
    </linearGradient>
    <linearGradient id="sb-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f7ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f2f7ff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sb-link" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="sb-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000817" flood-opacity="0.38"/>
    </filter>
    <filter id="sb-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="sb-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#d9f99d" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#sb-bg)"/>
  <rect width="400" height="300" fill="url(#sb-grid)"/>
  <path d="M0 246C68 230 95 272 160 252C229 231 258 198 400 222V300H0Z" fill="#04110f" opacity="0.38"/>

  <g filter="url(#sb-shadow)">
    <rect x="28" y="26" width="344" height="238" rx="8" fill="#07111f" stroke="#dbeafe" stroke-opacity="0.16"/>
    <rect x="29" y="27" width="342" height="56" rx="7" fill="url(#sb-panel)"/>
    <rect x="48" y="50" width="64" height="8" rx="4" fill="#f8fafc" opacity="0.82"/>
    <rect x="125" y="49" width="42" height="10" rx="5" fill="#5eead4" opacity="0.78"/>
    <rect x="177" y="49" width="42" height="10" rx="5" fill="#fbbf24" opacity="0.76"/>
    <rect x="319" y="45" width="27" height="18" rx="6" fill="#fb7185" opacity="0.78"/>

    <rect x="48" y="104" width="88" height="126" rx="8" fill="#0e1728" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="64" y="122" width="42" height="7" rx="3.5" fill="#e2e8f0" opacity="0.88"/>
    <rect x="64" y="142" width="54" height="6" rx="3" fill="#5eead4" opacity="0.62"/>
    <rect x="64" y="159" width="38" height="6" rx="3" fill="#fbbf24" opacity="0.68"/>
    <rect x="64" y="176" width="58" height="6" rx="3" fill="#93c5fd" opacity="0.6"/>
    <rect x="64" y="199" width="28" height="16" rx="5" fill="#5eead4" opacity="0.16" stroke="#5eead4" stroke-opacity="0.42"/>
    <rect x="98" y="199" width="26" height="16" rx="5" fill="#fbbf24" opacity="0.16" stroke="#fbbf24" stroke-opacity="0.42"/>

    <rect x="154" y="104" width="188" height="126" rx="8" fill="#0b1324" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M206 159L247 127L293 151M206 159L239 194M247 127L239 194M293 151L239 194M206 159L184 199" fill="none" stroke="url(#sb-link)" stroke-width="2" stroke-linecap="round" opacity="0.82"/>
    <g filter="url(#sb-soft)">
      <circle cx="206" cy="159" r="22" fill="#0f766e" stroke="#5eead4" stroke-width="2"/>
      <circle cx="247" cy="127" r="17" fill="#92400e" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="293" cy="151" r="15" fill="#7f1d1d" stroke="#fb7185" stroke-width="2"/>
      <circle cx="239" cy="194" r="19" fill="#1e3a8a" stroke="#93c5fd" stroke-width="2"/>
      <circle cx="184" cy="199" r="11" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    </g>
    <rect x="193" y="155" width="26" height="5" rx="2.5" fill="#ccfbf1"/>
    <rect x="237" y="124" width="20" height="5" rx="2.5" fill="#fef3c7"/>
    <rect x="282" y="148" width="22" height="5" rx="2.5" fill="#ffe4e6"/>
    <rect x="228" y="191" width="22" height="5" rx="2.5" fill="#dbeafe"/>
