  <text x="48" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#e5e7eb" opacity="0.76">SECOND BRAIN</text>
  <text x="300" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#5eead4" opacity="0.82">KNOWLEDGE MAP</text>
</svg>
