<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="github-home-title">
  <title id="github-home-title">GitHub Home portfolio interface preview</title>
  <defs>
    <linearGradient id="gh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19201a"/>
      <stop offset="0.45" stop-color="#101827"/>
      <stop offset="1" stop-color="#221622"/>
    </linearGradient>
    <linearGradient id="gh-hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#bef264"/>
      <stop offset="1" stop-color="#fda4af"/>
    </linearGradient>
    <filter id="gh-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <pattern id="gh-dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" opacity="0.08"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#gh-bg)"/>
  <rect width="400" height="300" fill="url(#gh-dots)"/>

  <g filter="url(#gh-shadow)">
    <rect x="30" y="26" width="340" height="238" rx="8" fill="#07111f" stroke="#e0f2fe" stroke-opacity="0.14"/>
    <rect x="31" y="27" width="338" height="34" rx="7" fill="#f8fafc" opacity="0.08"/>
    <circle cx="50" cy="43" r="4" fill="#fda4af"/>
    <circle cx="64" cy="43" r="4" fill="#facc15"/>
    <circle cx="78" cy="43" r="4" fill="#86efac"/>
    <rect x="101" y="38" width="96" height="10" rx="5" fill="#dbeafe" opacity="0.68"/>
    <rect x="298" y="37" width="44" height="12" rx="6" fill="#7dd3fc" opacity="0.28" stroke="#7dd3fc" stroke-opacity="0.5"/>

    <rect x="52" y="84" width="132" height="58" rx="8" fill="#0d1728" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="68" y="100" width="66" height="9" rx="4.5" fill="#f8fafc"/>
    <rect x="68" y="118" width="90" height="6" rx="3" fill="#94a3b8"/>
    <rect x="68" y="130" width="56" height="6" rx="3" fill="#7dd3fc"/>
    <path d="M52 142H184" stroke="url(#gh-hero)" stroke-width="2"/>

    <rect x="204" y="84" width="116" height="58" rx="8" fill="#102019" stroke="#bef264" stroke-opacity="0.28"/>
    <rect x="222" y="102" width="36" height="8" rx="4" fill="#bef264" opacity="0.85"/>
    <rect x="222" y="120" width="74" height="6" rx="3" fill="#d9f99d" opacity="0.46"/>
    <rect x="222" y="132" width="52" height="6" rx="3" fill="#d9f99d" opacity="0.3"/>

    <rect x="52" y="162" width="268" height="72" rx="8" fill="#0b1324" stroke="#ffffff" stroke-opacity="0.08"/>
    <g>
      <rect x="68" y="178" width="74" height="40" rx="6" fill="#111827" stroke="#7dd3fc" stroke-opacity="0.24"/>
      <rect x="82" y="191" width="32" height="6" rx="3" fill="#7dd3fc"/>
      <rect x="82" y="204" width="46" height="5" rx="2.5" fill="#94a3b8"/>
    </g>
    <g>
      <rect x="161" y="178" width="74" height="40" rx="6" fill="#111827" stroke="#fda4af" stroke-opacity="0.24"/>
      <rect x="175" y="191" width="36" height="6" rx="3" fill="#fda4af"/>
      <rect x="175" y="204" width="44" height="5" rx="2.5" fill="#94a3b8"/>
    </g>
    <g>
      <rect x="254" y="178" width="50" height="40" rx="6" fill="#111827" stroke="#bef264" stroke-opacity="0.24"/>
      <rect x="267" y="189" width="7" height="20" rx="2" fill="#7dd3fc"/>
      <rect x="279" y="195" width="7" height="14" rx="2" fill="#bef264"/>
      <rect x="291" y="184" width="7" height="25" rx="2" fill="#fda4af"/>
    </g>
  </g>

  <text x="48" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#e5e7eb" opacity="0.76">GITHUB HOME</text>
  <text x="292" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#bef264" opacity="0.84">PORTFOLIO OS</text>
</svg>
