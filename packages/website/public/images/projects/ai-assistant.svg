<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="ai-assistant-title">
  <title id="ai-assistant-title">AI Assistant conversational interface preview</title>
  <defs>
    <linearGradient id="ai-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18221c"/>
      <stop offset="0.42" stop-color="#121829"/>
      <stop offset="1" stop-color="#28191e"/>
    </linearGradient>
    <linearGradient id="ai-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.48" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="ai-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="ai-glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="ai-lines" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M0 16H32" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="400" height="300" fill="url(#ai-bg)"/>
  <rect width="400" height="300" fill="url(#ai-lines)"/>

  <g filter="url(#ai-shadow)">
    <rect x="32" y="28" width="336" height="236" rx="8" fill="#07111f" stroke="#f8fafc" stroke-opacity="0.14"/>
    <rect x="50" y="50" width="76" height="164" rx="8" fill="#101827" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="67" y="69" width="42" height="42" rx="8" fill="#0f766e" stroke="#67e8f9" stroke-opacity="0.55"/>
    <g filter="url(#ai-glow)">
      <path d="M82 83H94M76 94H100M82 105H94" stroke="#ccfbf1" stroke-width="3" stroke-linecap="round"/>
    </g>
    <rect x="66" y="132" width="38" height="7" rx="3.5" fill="#f8fafc" opacity="0.72"/>
    <rect x="66" y="149" width="46" height="6" rx="3" fill="#94a3b8"/>
    <rect x="66" y="164" width="34" height="6" rx="3" fill="#94a3b8"/>
    <rect x="66" y="190" width="44" height="10" rx="5" fill="#67e8f9" opacity="0.16" stroke="#67e8f9" stroke-opacity="0.4"/>

    <rect x="144" y="50" width="200" height="164" rx="8" fill="#0b1324" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="162" y="70" width="118" height="24" rx="8" fill="#182235"/>
    <rect x="176" y="79" width="70" height="6" rx="3" fill="#cbd5e1" opacity="0.78"/>
    <rect x="214" y="108" width="104" height="24" rx="8" fill="#0f766e" opacity="0.7"/>
    <rect x="229" y="117" width="64" height="6" rx="3" fill="#ccfbf1" opacity="0.84"/>
    <rect x="162" y="146" width="132" height="24" rx="8" fill="#3b2430" opacity="0.88"/>
    <rect x="176" y="155" width="88" height="6" rx="3" fill="#fecdd3" opacity="0.82"/>
    <rect x="162" y="188" width="164" height="10" rx="5" fill="#050b16" stroke="#ffffff" stroke-opacity="0.08"/>
    <rect x="172" y="192" width="104" height="3" rx="1.5" fill="url(#ai-accent)"/>

    <path d="M142 232H346" stroke="url(#ai-accent)" stroke-width="2" stroke-linecap="round"/>
    <g filter="url(#ai-glow)">
      <circle cx="156" cy="232" r="4" fill="#67e8f9"/>
      <circle cx="207" cy="232" r="4" fill="#fef08a"/>
      <circle cx="269" cy="232" r="4" fill="#fb7185"/>
      <circle cx="331" cy="232" r="4" fill="#86efac"/>
    </g>
  </g>

  <text x="48" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#e5e7eb" opacity="0.76">AI ASSISTANT</text>
  <text x="285" y="282" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" fill="#fef08a" opacity="0.84">CONTEXT READY</text>
</svg>
